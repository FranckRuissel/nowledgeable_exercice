name: Share data between jobs
run-name: ${{ github.actor }} partage des données entre jobs 🚀
on:
  workflow_dispatch: # Permet le déclenchement manuel depuis l'interface
  schedule:
    - cron: '*/5 * * * *' # Planification automatique (intervalle minimal réel d'environ 5 min)
jobs:
  job_1:
    name: Add 3 and 7
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 Job déclenché par un évènement ${{ github.event_name }}."
      - run: echo "🐧 Ce job tourne sur un runner ${{ runner.os }}."

      # Écrire le résultat de 3 + 7 dans un fichier du dossier courant
      - name: Calculer 3 + 7
        shell: bash
        run: |
          expr 3 + 7 > math-homework.txt

      # Publier le fichier comme artefact pour que le job suivant puisse le récupérer
      - name: Uploader le résultat du job 1
        uses: actions/upload-artifact@v4
        with:
          name: homework_pre
          path: math-homework.txt
  job_2:
    name: Multiply by 9
    needs: job_1 # Force job_2 à attendre la fin de job_1
    runs-on: windows-latest
    steps:
      - run: echo "🖥️ Ce job tourne sur un runner ${{ runner.os }}."

      # Récupérer le fichier produit par job_1 (dépose dans le dossier courant)
      - name: Télécharger le résultat du job 1
        uses: actions/download-artifact@v5
        with:
          name: homework_pre

      # Lire la valeur, la multiplier par 9, réécrire le fichier
      - name: Multiplier par 9
        shell: bash
        run: |
          value=`cat math-homework.txt`
          expr $value \* 9 > math-homework.txt
      # Nouveau nom d'artefact obligatoire (les artefacts sont immuables en v4)
      - name: Uploader le résultat du job 2
        uses: actions/upload-artifact@v4
        with:
          name: homework_final
          path: math-homework.txt
  job_3:
    name: Display results
    needs: job_2 # Force job_3 à attendre la fin de job_2
    runs-on: macOS-latest
    steps:
      - run: echo "🍏 Ce job tourne sur un runner ${{ runner.os }}."
      # Récupérer le résultat final
      - name: Télécharger le résultat du job 2
        uses: actions/download-artifact@v5
        with:
          name: homework_final
      # Afficher la valeur dans les logs
      - name: Afficher le résultat final
        shell: bash
        run: |
          value=`cat math-homework.txt`
          echo "Le résultat est $value"
      # Republier le fichier sous un nom distinct pour le rendre téléchargeable depuis l'interface
      - name: Uploader le résultat récupérable
        uses: actions/upload-artifact@v4
        with:
          name: resultat-final
          path: math-homework.txt
      - run: |
          echo "✅ Statut du job : ${{ job.status }}."
